[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lp-relabel"
version = "0.1.0"
description = "Pick frames a Lightning Pose model is unsure about and queue them, with its predictions prefilled, for correction in the Lightning Pose App labeler."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy",
    "pandas",
    "pyyaml",
    "pillow",
    # Frame-exact seeking: presentation times from the MP4 sample tables,
    # read over HTTP range requests for S3 URLs; transcode_video
    # (normalize_cfr) and extract_frame_by_index for clean clips.
    "aind-video-utils==0.11.0",
]

[project.optional-dependencies]
s3 = ["boto3"]
dev = ["pytest"]

[project.scripts]
lp-relabel = "lp_relabel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lp_relabel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
